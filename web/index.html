<style>
:root{--bg:#fff;--card:rgba(255,255,255,.86);--tx:#14181d;--tx2:#68717d;--sep:rgba(60,72,88,.14);--fill:rgba(120,130,145,.13);--acc:#0b6e99;--ok:#1e9b57;--red:#d92f2f;--halo:#fff;
  --sh:0 1px 2px rgba(16,24,40,.08),0 10px 30px rgba(16,24,40,.16);--r:14px}
html[data-t=dark]{--bg:#161b21;--card:rgba(28,34,41,.84);--tx:#eef2f6;--tx2:#97a2af;--sep:rgba(200,215,230,.14);--fill:rgba(150,165,185,.18);--acc:#46b0dd;--ok:#4cc582;--red:#ff6b64;--halo:#0d1115;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.oculto{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#map{position:fixed;inset:0;z-index:1;background:var(--fill)}
.leaflet-container{font:inherit;background:var(--fill)}
.leaflet-tile-pane{filter:saturate(.8) contrast(.96) brightness(1.03)}
html[data-t=dark] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) saturate(.7) brightness(.92) contrast(.9)}
.leaflet-control-attribution{background:var(--card)!important;color:var(--tx2)!important;font-size:10px;backdrop-filter:blur(10px)}
.leaflet-control-attribution a{color:var(--tx2)!important}
.leaflet-bar{border:0!important;box-shadow:var(--sh)!important;border-radius:12px!important;overflow:hidden}
.leaflet-bar a{background:var(--card)!important;color:var(--tx)!important;border-color:var(--sep)!important;backdrop-filter:blur(14px)}
/* barra superior */
#top{position:fixed;z-index:500;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));max-width:440px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
body.con-sesion #top{right:calc(max(10px,env(safe-area-inset-right)) + 46px)}
.glass{background:var(--card);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);box-shadow:var(--sh)}
#pill{display:flex;align-items:center;gap:8px;height:48px;padding:0 4px 0 14px;border-radius:var(--r);color:var(--tx2)}
#buscar{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--tx)}
#buscar::placeholder{color:var(--tx2)}
#gps{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--acc)}
#gps:active{background:var(--fill)}
#sug{border-radius:var(--r);overflow:auto;max-height:42vh}
#sug button{display:block;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--sep)}
#sug button:first-child{border-top:0}
#sug small{display:block;color:var(--tx2);font-size:12.5px}
#chip{align-self:flex-start;display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:15px;font-size:12.5px;font-weight:500;color:var(--tx)}
#chip .pto{width:7px;height:7px;border-radius:50%;background:var(--tx2)}
#chip.live .pto{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
#chip em{font-style:normal;color:var(--acc)}
#chips{display:flex;gap:6px;align-self:flex-start}
#filtro{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:15px;font-size:12.5px;font-weight:500;color:var(--tx)}
#filtro .pto{width:9px;height:9px;border-radius:50%;background:conic-gradient(#e6194b 0 25%,#3cb44b 0 50%,#4363d8 0 75%,#f58231 0)}
#filtro.on{color:var(--tx);font-weight:600}
#filtro.on .pto{background:var(--c)}
.lineas{display:grid;grid-template-columns:1fr;gap:0;padding:0 2px 8px}
.lineas button{display:flex;align-items:center;gap:12px;padding:9px 4px;border-top:1px solid var(--sep);text-align:left;font-size:15px;color:var(--tx)}
.lineas button:first-child{border-top:0}
.lineas .badge{flex:none}
#gear{position:fixed;z-index:500;top:max(10px,env(safe-area-inset-top));right:max(6px,env(safe-area-inset-right));width:44px;height:48px;display:grid;place-items:center;color:var(--tx);filter:drop-shadow(0 0 1.5px var(--halo)) drop-shadow(0 0 4px var(--halo))}
#gear svg{width:24px;height:24px}
/* panel de parada */
#panel{position:fixed;z-index:480;left:0;right:0;bottom:0;max-height:62vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 18px max(22px,env(safe-area-inset-bottom));background:var(--bg);box-shadow:0 -6px 30px rgba(0,0,0,.2);overscroll-behavior:contain}
#panel .grab{width:38px;height:5px;border-radius:3px;background:var(--sep);margin:2px auto 10px}
#cerrar{position:absolute;top:12px;right:14px;width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--tx2);display:grid;place-items:center}
#cerrar svg{width:15px;height:15px;stroke-width:2.4}
#pn{margin:0 40px 0 0;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
#ps{color:var(--tx2);font-size:13px;margin:2px 0 12px}
#seg,.seg{display:flex;gap:2px;padding:2px;background:var(--fill);border-radius:10px;overflow-x:auto;scrollbar-width:none}
#seg button,.seg button{flex:1 0 auto;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap;color:var(--tx2)}
#seg button.on,.seg button.on{background:var(--bg);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.16)}
#lista h3{margin:18px 0 2px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2)}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:12px 0;border-top:1px solid var(--sep)}
#lista h3+.row{border-top:0}
.badge{min-width:46px;height:30px;padding:0 8px;border-radius:9px;color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center}
.when{flex:1;min-width:0}
.when b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em}
.when small{color:var(--tx2);font-size:12.5px}
.tag{font-size:11.5px;color:var(--tx2);text-align:right}
.tag.live{color:var(--ok);font-weight:600}
.sub{flex-basis:100%;padding-left:58px;margin-top:-6px}
.sub button{color:var(--acc);font-weight:600;font-size:14px}
.sub button:disabled{opacity:.5}
.sub span{color:var(--ok);font-size:13px;font-weight:500}
.vacio,#nota{color:var(--tx2);font-size:13px;margin:14px 0 0}
#acc{display:flex;flex-wrap:wrap;gap:4px 18px;margin:-6px 0 12px}
#acc button{color:var(--acc);font-weight:600;font-size:14px;padding:4px 0}
button.badge{cursor:pointer}
.pl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 0;border-top:1px solid var(--sep);font-size:15px}
.pl i{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid var(--bg);box-shadow:0 0 0 2px var(--c)}
.horas{font-size:14px;line-height:1.5;padding:8px 0}
.horas b{font-weight:600}
.trb{display:flex;align-items:center;gap:3px}
.trb .badge{min-width:34px;height:26px;font-size:13px;border-radius:8px;padding:0 6px}
.trb span{color:var(--tx2);font-size:12px}
.pasos{flex-basis:100%;margin:-4px 0 0;padding:0 0 0 2px;list-style:none;font-size:13.5px;line-height:1.5;color:var(--tx2)}
.pasos li{padding:3px 0 3px 14px;position:relative}
.pasos li:before{content:"";position:absolute;left:2px;top:11px;width:6px;height:6px;border-radius:50%;background:var(--c,var(--tx2))}
.pasos b{color:var(--tx);font-weight:600}
.botones{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px 22px}
.elegir{text-align:left;color:var(--acc);font-weight:600;font-size:14px;padding:2px 0}
#panel.mini{overflow:hidden;cursor:pointer;padding-bottom:max(14px,env(safe-area-inset-bottom))}
#panel.mini>:not(.grab):not(#pn):not(#ps):not(#cerrar){display:none}
#panel.mini #pn{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:40px}
#panel .grab{cursor:pointer;position:relative}
#panel .grab:after{content:"";position:absolute;inset:-12px -40px}
@media (min-width:820px){#panel{left:10px;right:auto;top:124px;bottom:10px;width:392px;max-height:none;border-radius:20px;box-shadow:var(--sh)}#panel .grab{display:none}#panel{padding-top:18px}}
/* bienvenida */
#intro{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
#intro .in{width:100%;max-width:360px;text-align:center}
#intro svg.logo{width:76px;height:76px;margin-bottom:22px;filter:drop-shadow(0 8px 18px rgba(11,110,153,.35))}
#intro h1{font-size:30px;line-height:1.12;letter-spacing:-.03em;margin:0 0 10px}
#intro p{color:var(--tx2);margin:0 0 34px;font-size:16px}
.btn{display:block;width:100%;height:52px;border-radius:14px;background:var(--acc);color:#fff;font-size:17px;font-weight:600}
html[data-t=dark] .btn{color:#06222e}
.btn:active{filter:brightness(.92)}
.btn.sec{background:var(--fill);color:var(--acc)}
#intro small{display:block;color:var(--tx2);font-size:12.5px;margin:8px 0 18px}
/* ajustes */
#sheet{position:fixed;inset:0;z-index:800;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.38);backdrop-filter:blur(2px)}
#scard{width:100%;max-width:440px;max-height:90vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:6px 16px max(22px,env(safe-area-inset-bottom))}
@media (min-width:600px){#sheet{align-items:center}#scard{border-radius:22px;box-shadow:var(--sh)}}
#shead{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 6px}
#shead b{font-size:17px}
#shead button{color:var(--acc);font-weight:600;font-size:16px}
.acct{display:flex;align-items:center;gap:14px;padding:12px 4px 18px}
.av{width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;font-size:24px;font-weight:600;display:grid;place-items:center;flex:none}
html[data-t=dark] .av{color:#06222e}
.acct b{display:block;font-size:17px}
.acct small{display:block;color:var(--tx2);font-size:13px}
#scard h4{margin:14px 6px 6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2)}
.grp{background:var(--fill);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:50px;padding:8px 14px;text-align:left}
.li+.li{border-top:1px solid var(--sep)}
.li .seg{min-width:170px}
.li em{font-style:normal;color:var(--tx2)}
.li.red{color:var(--red);font-weight:500;justify-content:center}
.rel{padding:14px}
.relh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.relh b{font-size:20px;letter-spacing:-.02em}.relh span{color:var(--tx2)}
.bar{height:8px;border-radius:4px;background:var(--sep);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .4s}
.rel small{display:block;color:var(--tx2);margin-top:9px;font-size:12.5px}
#toast{position:fixed;z-index:1000;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;max-width:min(92vw,420px);padding:11px 16px;border-radius:14px;background:#1d242c;color:#fff;font-size:13.5px;box-shadow:var(--sh);transition:.25s}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const json = async u => { const r = await fetch(u); if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); };
const ancho = () => matchMedia('(min-width:820px)').matches;
function toast(m, ms = 6500) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), ms); }

// ── Mapa y tema ──
const map = L.map('map', { preferCanvas: true, zoomControl: false }).setView([28.35, -14.0], 9);
map.attributionControl.setPrefix(false);

// Donde varias líneas comparten calle se dibujan en paralelo (como un plano de metro): cada tramo trae su

// Desplazamiento lateral en píxeles (os[k] = el del segmento k, en anchos de línea). Donde cambia, la línea se va

const TRANSICION = 36;

    let v = os[k] * paso;

function miUbicacion() {

    if (!navigator.geolocation) return mal(new Error('Tu navegador no permite la ubicación.'));
    navigator.geolocation.getCurrentPosition(pos => {

Guaguas.onPerfil(() => { if (!$('sheet').classList.contains('oculto')) ajustes(); });
Guaguas.iniciar().catch(e => console.warn('identidad de dispositivo no disponible:', e.message));
datos().then(() => {
  const id = new URLSearchParams(location.search).get('parada');
  const p = id && paradas.find(x => x.id === id);
  if (p) { foco(p, 16); elegir({ tipo: 'parada', ...p }); }
}).catch(e => { console.warn('datos:', e.message); toast('No se pudieron cargar las paradas. Comprueba tu conexión y recarga la página.', 12000); });
(async () => {
  authListo = await window.firebaseListo;
  if (!authListo) return console.warn('Firebase no disponible: modo estático.');
  await handleRedirectResult();
  if (localStorage.getItem('modoDinamico') === null) mostrarIntro();
  window.firebaseOnAuthChanged(async u => {
    if (u) { try { if (await exchangeFirebaseToken(await u.getIdToken())) cargarFavoritas(); } catch (e) { console.warn(e.message); } }
    else { Guaguas.setInternalToken(null); favs = new Set(); }
    ui();
  });
})();
if ('serviceWorker' in navigator) {
  window.__swTeniaControl = !!navigator.serviceWorker.controller;
  window.swListo = navigator.serviceWorker.register('/sw.js').then(r => { r.update().catch(() => {}); return r; }).catch(e => { console.warn('SW:', e.message); return null; });
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!window.__swRecargado && window.__swTeniaControl) { window.__swRecargado = true; location.reload(); } });
}
