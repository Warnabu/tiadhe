<!doctype html>
<html lang="es" data-t="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Guaguas Fuerteventura</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#fff;--card:rgba(255,255,255,.86);--tx:#14181d;--tx2:#68717d;--sep:rgba(60,72,88,.14);--fill:rgba(120,130,145,.13);--acc:#0b6e99;--ok:#1e9b57;--red:#d92f2f;--halo:#fff;
  --sh:0 1px 2px rgba(16,24,40,.08),0 10px 30px rgba(16,24,40,.16);--r:14px}
html[data-t=dark]{--bg:#161b21;--card:rgba(28,34,41,.84);--tx:#eef2f6;--tx2:#97a2af;--sep:rgba(200,215,230,.14);--fill:rgba(150,165,185,.18);--acc:#46b0dd;--ok:#4cc582;--red:#ff6b64;--halo:#0d1115;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.oculto{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#map{position:fixed;inset:0;z-index:1;background:var(--fill)}
.leaflet-container{font:inherit;background:var(--fill)}
.leaflet-control-attribution{background:var(--card)!important;color:var(--tx2)!important;font-size:10px;backdrop-filter:blur(10px)}
.leaflet-control-attribution a{color:var(--tx2)!important}
.leaflet-bar{border:0!important;box-shadow:var(--sh)!important;border-radius:12px!important;overflow:hidden}
.leaflet-bar a{background:var(--card)!important;color:var(--tx)!important;border-color:var(--sep)!important;backdrop-filter:blur(14px)}
/* barra superior */
#top{position:fixed;z-index:500;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));max-width:440px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
body.con-sesion #top{right:calc(max(10px,env(safe-area-inset-right)) + 46px)}
.glass{background:var(--card);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);box-shadow:var(--sh)}
#pill{display:flex;align-items:center;gap:8px;height:48px;padding:0 4px 0 14px;border-radius:var(--r);color:var(--tx2)}
#buscar{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--tx)}
#buscar::placeholder{color:var(--tx2)}
#gps{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--acc)}
#gps:active{background:var(--fill)}
#sug{border-radius:var(--r);overflow:auto;max-height:42vh}
#sug button{display:block;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--sep)}
#sug button:first-child{border-top:0}
#sug small{display:block;color:var(--tx2);font-size:12.5px}
#chip{align-self:flex-start;display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:15px;font-size:12.5px;font-weight:500;color:var(--tx)}
#chip .pto{width:7px;height:7px;border-radius:50%;background:var(--tx2)}
#chip.live .pto{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
#chip em{font-style:normal;color:var(--acc)}
#gear{position:fixed;z-index:500;top:max(10px,env(safe-area-inset-top));right:max(6px,env(safe-area-inset-right));width:44px;height:48px;display:grid;place-items:center;color:var(--tx);filter:drop-shadow(0 0 1.5px var(--halo)) drop-shadow(0 0 4px var(--halo))}
#gear svg{width:24px;height:24px}
/* panel de parada */
#panel{position:fixed;z-index:480;left:0;right:0;bottom:0;max-height:62vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 18px max(22px,env(safe-area-inset-bottom));background:var(--bg);box-shadow:0 -6px 30px rgba(0,0,0,.2);overscroll-behavior:contain}
#panel .grab{width:38px;height:5px;border-radius:3px;background:var(--sep);margin:2px auto 10px}
#cerrar{position:absolute;top:12px;right:14px;width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--tx2);display:grid;place-items:center}
#cerrar svg{width:15px;height:15px;stroke-width:2.4}
#pn{margin:0 40px 0 0;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
#ps{color:var(--tx2);font-size:13px;margin:2px 0 12px}
#seg,.seg{display:flex;gap:2px;padding:2px;background:var(--fill);border-radius:10px;overflow-x:auto;scrollbar-width:none}
#seg button,.seg button{flex:1 0 auto;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap;color:var(--tx2)}
#seg button.on,.seg button.on{background:var(--bg);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.16)}
#lista h3{margin:18px 0 2px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2)}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:12px 0;border-top:1px solid var(--sep)}
#lista h3+.row{border-top:0}
.badge{min-width:46px;height:30px;padding:0 8px;border-radius:9px;color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center}
.when{flex:1;min-width:0}
.when b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em}
.when small{color:var(--tx2);font-size:12.5px}
.tag{font-size:11.5px;color:var(--tx2);text-align:right}
.tag.live{color:var(--ok);font-weight:600}
.sub{flex-basis:100%;padding-left:58px;margin-top:-6px}
.sub button{color:var(--acc);font-weight:600;font-size:14px}
.sub button:disabled{opacity:.5}
.sub span{color:var(--ok);font-size:13px;font-weight:500}
.vacio,#nota{color:var(--tx2);font-size:13px;margin:14px 0 0}
@media (min-width:820px){#panel{left:10px;right:auto;top:124px;bottom:10px;width:392px;max-height:none;border-radius:20px;box-shadow:var(--sh)}#panel .grab{display:none}#panel{padding-top:18px}}
/* bienvenida */
#intro{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
#intro .in{width:100%;max-width:360px;text-align:center}
#intro svg.logo{width:76px;height:76px;margin-bottom:22px;filter:drop-shadow(0 8px 18px rgba(11,110,153,.35))}
#intro h1{font-size:30px;line-height:1.12;letter-spacing:-.03em;margin:0 0 10px}
#intro p{color:var(--tx2);margin:0 0 34px;font-size:16px}
.btn{display:block;width:100%;height:52px;border-radius:14px;background:var(--acc);color:#fff;font-size:17px;font-weight:600}
html[data-t=dark] .btn{color:#06222e}
.btn:active{filter:brightness(.92)}
.btn.sec{background:var(--fill);color:var(--acc)}
#intro small{display:block;color:var(--tx2);font-size:12.5px;margin:8px 0 18px}
/* ajustes */
#sheet{position:fixed;inset:0;z-index:800;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.38);backdrop-filter:blur(2px)}
#scard{width:100%;max-width:440px;max-height:90vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:6px 16px max(22px,env(safe-area-inset-bottom))}
@media (min-width:600px){#sheet{align-items:center}#scard{border-radius:22px;box-shadow:var(--sh)}}
#shead{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 6px}
#shead b{font-size:17px}
#shead button{color:var(--acc);font-weight:600;font-size:16px}
.acct{display:flex;align-items:center;gap:14px;padding:12px 4px 18px}
.av{width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;font-size:24px;font-weight:600;display:grid;place-items:center;flex:none}
html[data-t=dark] .av{color:#06222e}
.acct b{display:block;font-size:17px}
.acct small{display:block;color:var(--tx2);font-size:13px}
#scard h4{margin:14px 6px 6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2)}
.grp{background:var(--fill);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:50px;padding:8px 14px;text-align:left}
.li+.li{border-top:1px solid var(--sep)}
.li .seg{min-width:170px}
.li em{font-style:normal;color:var(--tx2)}
.li.red{color:var(--red);font-weight:500;justify-content:center}
.rel{padding:14px}
.relh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.relh b{font-size:20px;letter-spacing:-.02em}.relh span{color:var(--tx2)}
.bar{height:8px;border-radius:4px;background:var(--sep);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .4s}
.rel small{display:block;color:var(--tx2);margin-top:9px;font-size:12.5px}
#toast{position:fixed;z-index:1000;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;max-width:min(92vw,420px);padding:11px 16px;border-radius:14px;background:#1d242c;color:#fff;font-size:13.5px;box-shadow:var(--sh);transition:.25s}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<script>

const AUTH_DOMAIN_PROPIO = false;
const usarPropio = AUTH_DOMAIN_PROPIO || new URLSearchParams(location.search).get("authdomain") === "propio";

const firebaseConfig = {
  apiKey: "AIzaSyBlcA2zXuqVpQRnwso0aZ83HjRxj1KWo_k",   // clave web pública: se protege con restricciones en Google Cloud, no ocultándola
  authDomain: usarPropio ? location.host : "guaguas-ftv1.firebaseapp.com",

  storageBucket: "guaguas-ftv1.firebasestorage.app",
  messagingSenderId: "492276628357",
  appId: "1:492276628357:web:1c35bd297d7c68f40c62ec",
  measurementId: "G-29X3LWCFY5"
};
window.VAPID_KEY = "BNApzvqctw8OIzaUdQbvfUerCqgZRJxPJ3jgkrmOd_txqwb8jWbn4zLDrBLLr-emzqHVkIGoV2Uh9coLAxsCffo";

let ok = false;
try {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  window.firebaseAuth = auth;
  window.firebaseSignIn = () => signInWithPopup(auth, provider);
  window.firebaseSignInRedirect = () => signInWithRedirect(auth, provider);
  window.firebaseGetRedirectResult = () => getRedirectResult(auth);
  window.firebaseSignOut = () => signOut(auth);
  window.firebaseCurrentUser = () => auth.currentUser;
  window.firebaseAuthReady = () => auth.authStateReady();
  window.firebaseOnAuthChanged = cb => onAuthStateChanged(auth, cb);
  ok = true;

  // Messaging es opcional: en navegadores sin soporte (p. ej. Safari iOS fuera de la PWA instalada) getMessaging lanza
  // y antes tumbaba TODO el módulo, dejando "Firebase Auth no disponible".

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const json = async u => { const r = await fetch(u); if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); };
const ancho = () => matchMedia('(min-width:820px)').matches;
function toast(m, ms = 6500) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), ms); }

// ── Mapa y tema ──
const map = L.map('map', { preferCanvas: true, zoomControl: false }).setView([28.35, -14.0], 9);
map.attributionControl.setPrefix(false);
if (!matchMedia('(pointer:coarse)').matches) L.control.zoom({ position: 'bottomright' }).addTo(map);
let tiles = null;
const mq = matchMedia('(prefers-color-scheme: dark)');
function tema() {
  const p = localStorage.getItem('tema') || 'auto', d = p === 'dark' || (p === 'auto' && mq.matches);
  document.documentElement.dataset.t = d ? 'dark' : 'light';
  document.querySelector('meta[name=theme-color]').content = d ? '#161b21' : '#ffffff';
  if (tiles) map.removeLayer(tiles);
  tiles = L.tileLayer(`https://{s}.basemaps.cartocdn.com/${d ? 'dark' : 'light'}_all/{z}/{x}/{y}{r}.png`,
    { maxZoom: 19, subdomains: 'abcd', attribution: '© OpenStreetMap · © CARTO' }).addTo(map);
}
mq.addEventListener('change', tema); tema();
addEventListener('resize', () => map.invalidateSize());

// ── Datos ──
let paradas = [], lugares = [], colores = {}, actual = null, filtro = null, timer = null, marcaSel = null, marcaYo = null, marcadas = new Set();
async function datos() {
  const [lineas, ps, osm, lug] = await Promise.all([json('/api/lineas'), json('/api/paradas'), json('/api/osm'), json('/api/lugares')]);
  lugares = lug; paradas = ps;
  lineas.forEach(l => { colores[l.num] = l.color; L.polyline(l.trazado, { color: l.color, weight: 3.5, opacity: .75, interactive: false }).addTo(map); });
  osm.forEach(p => L.circleMarker([p.lat, p.lon], { radius: 4, color: '#fff', weight: 1, fillColor: '#8b95a1', fillOpacity: .9 }).addTo(map)
    .on('click', () => elegir({ tipo: 'osm', nombre: p.n, lat: p.lat, lon: p.lon })));
  ps.forEach(p => L.circleMarker([p.lat, p.lon], { radius: 7, color: '#fff', weight: 2.5, fillColor: '#0b6e99', fillOpacity: 1 }).addTo(map)
    .on('click', () => elegir({ tipo: 'parada', ...p })));
}
function foco(p, z = 15) {
  map.setView([p.lat, p.lon], Math.max(map.getZoom(), z), { animate: false });
  if (!ancho()) map.panBy([0, Math.round(innerHeight * .2)], { animate: false });
}
function elegir(p) {
  actual = p; filtro = null; marcadas = new Set();
  if (marcaSel) map.removeLayer(marcaSel);
  marcaSel = L.circleMarker([p.lat, p.lon], { radius: 13, color: '#ff3b30', weight: 3, fill: false }).addTo(map);
  $('pn').textContent = p.nombre; $('ps').textContent = ''; $('lista').innerHTML = '';
  $('panel').classList.remove('oculto'); $('sug').classList.add('oculto');
  cargar(); clearInterval(timer); timer = setInterval(cargar, 30000);
}
async function cargar() {
  const p = actual; if (!p) return;
  const modo = Guaguas.getModoDinamico() ? 'dinamico' : 'estatico';
  const url = (p.tipo === 'osm' ? `/api/cerca?lat=${p.lat}&lon=${p.lon}&nombre=${encodeURIComponent(p.nombre)}&` : `/api/parada/${p.id}?`) + `modo=${modo}`;
  try { pintar(await json(url), p); }
  catch (e) { if (p === actual) $('lista').innerHTML = '<p class="vacio">No se pudo cargar. Comprueba tu conexión.</p>'; }
}
function pintar(d, p) {
  if (p !== actual) return;
  $('ps').textContent = `${d.dia} · ${d.ahora}` + (d.parada.aprox ? ' · cálculo aproximado' : '');
  const ds = d.grupos.map(g => g.destino), sg = $('seg');
  sg.classList.toggle('oculto', ds.length < 2); sg.innerHTML = '';
  if (ds.length > 1) [['Todos', null], ...ds.map(x => ['→ ' + x, x])].forEach(([t, v]) => {
    const b = document.createElement('button'); b.textContent = t; b.className = filtro === v ? 'on' : '';
    b.onclick = () => { filtro = v; pintar(d, p); }; sg.appendChild(b);
  });
  const l = $('lista'); l.innerHTML = '';
  const gs = d.grupos.filter(g => !filtro || g.destino === filtro);
  if (!gs.length) l.innerHTML = '<p class="vacio">No hay más guaguas registradas para esta parada.</p>';
  gs.forEach(g => {
    const h = document.createElement('h3'); h.textContent = 'Hacia ' + g.destino; l.appendChild(h);
    g.salidas.forEach(s => {
      const vivo = s.prec === 'confirmada' || s.prec === 'vivo';
      const tag = s.prec === 'confirmada' ? `Confirmado · ${s.n}` : s.prec === 'vivo' ? `En directo · ${s.n}` : s.prec === 'oficial' ? 'Hora oficial' : s.cal ? 'Programada' : 'Estimada';
      const r = document.createElement('div'); r.className = 'row';
      r.innerHTML = `<span class="badge" style="background:${esc(colores[s.linea] || '#555')}">${esc(s.linea)}</span>
        <div class="when"><b>${esc(s.texto)}</b>${s.nota ? `<small>${esc(s.nota)}</small>` : ''}</div><span class="tag${vivo ? ' live' : ''}">${tag}</span>`;
      if (p.tipo === 'parada' && s.subir && Guaguas.getModoDinamico()) {
        const w = document.createElement('div'); w.className = 'sub';
        if (marcadas.has(s.viaje)) w.innerHTML = '<span>Avisaste de esta guagua</span>';
        else {
          const b = document.createElement('button'); b.textContent = 'Me he subido a esta guagua';
          b.onclick = async () => {
            b.disabled = true; b.textContent = 'Enviando…';
            try {
              const x = await Guaguas.marcarSubida(p.id, s.viaje); marcadas.add(s.viaje);
              w.innerHTML = '<span>' + (x.estado === 'confirmada' ? 'Confirmado por varias personas' : 'Avisado, esperando a más gente') + '</span>';
              if (x.estado === 'confirmada') cargar();
            } catch (e) { b.disabled = false; b.textContent = 'Me he subido a esta guagua'; toast(e.message); }
          };
          w.appendChild(b);
        }
        r.appendChild(w);
      }
      l.appendChild(r);
    });
  });
  $('nota').textContent = ds.length > 1 ? 'Hay guaguas en los dos sentidos: elige el de tu destino.' : '';
}
$('cerrar').onclick = () => { $('panel').classList.add('oculto'); clearInterval(timer); actual = null; if (marcaSel) map.removeLayer(marcaSel); };

// ── Búsqueda y ubicación ──
const cercana = (la, lo) => paradas.slice().sort((a, b) => Math.hypot(a.lat - la, (a.lon - lo) * .88) - Math.hypot(b.lat - la, (b.lon - lo) * .88))[0];
$('buscar').oninput = e => {
  const q = norm(e.target.value.trim()), s = $('sug');
  if (!q) { s.classList.add('oculto'); return; }
  const r = paradas.filter(p => norm(p.nombre).includes(q)).slice(0, 6).map(p => ({ t: p.nombre, sub: 'Líneas ' + p.lineas.join(', '), f: () => { foco(p); elegir({ tipo: 'parada', ...p }); } }));
  lugares.filter(l => norm(l.n).includes(q)).slice(0, 3).forEach(l => r.push({ t: l.n, sub: 'Lugar · parada más cercana', f: () => { const c = cercana(l.lat, l.lon); if (c) { foco(c); elegir({ tipo: 'parada', ...c }); } } }));
  s.innerHTML = ''; s.classList.toggle('oculto', !r.length);
  r.forEach(x => { const b = document.createElement('button'); b.innerHTML = `${esc(x.t)}<small>${esc(x.sub)}</small>`; b.onclick = () => { $('buscar').value = ''; $('buscar').blur(); x.f(); }; s.appendChild(b); });
};
$('gps').onclick = () => {
  if (!navigator.geolocation) return toast('Tu navegador no permite la ubicación.');
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: la, longitude: lo } = pos.coords;
    if (marcaYo) map.removeLayer(marcaYo);
    marcaYo = L.circleMarker([la, lo], { radius: 8, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1 }).addTo(map);
    const c = cercana(la, lo); if (!c) return;
    const km = Math.hypot((c.lat - la) * 111, (c.lon - lo) * 98);
    if (km > 2) toast(`La parada más cercana está a ${km.toFixed(1)} km: ${c.nombre}.`);
    foco(c, 15); elegir({ tipo: 'parada', ...c });
  }, () => toast('No pude obtener tu ubicación. Actívala en los ajustes del navegador.'), { enableHighAccuracy: true, timeout: 10000 });
};

// ── Cuenta, modos y ajustes ──
let authListo = false;
const usuario = () => (window.firebaseCurrentUser && window.firebaseCurrentUser()) || null;
const esMovil = () => /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || matchMedia('(display-mode: standalone)').matches;
function mensajeError(e) {
  const c = (e && e.code) || '';
  if (c === 'auth/network-request-failed') return 'No se pudo conectar con Google. Sigues con los horarios oficiales.';
  if (c === 'auth/unauthorized-domain') return 'Dominio no autorizado en Firebase (Authentication › Settings › Authorized domains).';
  if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return null;
  return 'No se pudo iniciar sesión' + (c ? ` (${c})` : '') + '.';
}
function ui() {
  const u = usuario(), d = Guaguas.getModoDinamico();
  document.body.classList.toggle('con-sesion', !!u);
  $('gear').classList.toggle('oculto', !u);
  const c = $('chip'); c.classList.toggle('live', d);
  c.innerHTML = d ? '<i class="pto"></i>Tiempo real' : '<i class="pto"></i>Horarios oficiales · <em>Activar tiempo real</em>';
  if (!$('sheet').classList.contains('oculto')) ajustes();
}
async function loginGoogle() {
  if (esMovil()) { await window.firebaseSignInRedirect(); return 'redirect'; }
  try { await window.firebaseSignIn(); return 'popup'; }
  catch (e) { if (e.code === 'auth/popup-blocked') { await window.firebaseSignInRedirect(); return 'redirect'; } throw e; }
}
async function activarDinamico() {
  if (!authListo) { toast('El inicio de sesión no está disponible ahora mismo.'); return false; }
  if (usuario()) { Guaguas.setModoDinamico(true); return true; }
  try {
    sessionStorage.setItem('pendingDinamico', '1');
    if ((await loginGoogle()) === 'redirect') return 'redirect';
    sessionStorage.removeItem('pendingDinamico'); Guaguas.setModoDinamico(true); return true;
  } catch (e) { sessionStorage.removeItem('pendingDinamico'); const m = mensajeError(e); if (m) toast(m); return false; }
}
const mostrarIntro = () => $('intro').classList.remove('oculto');
const ocultarIntro = () => { $('intro').classList.add('oculto'); setTimeout(() => map.invalidateSize(), 50); };
$('i-free').onclick = () => { Guaguas.setModoDinamico(false); ocultarIntro(); ui(); };
$('i-google').onclick = async () => { const r = await activarDinamico(); if (r === true) { ocultarIntro(); ui(); Guaguas.activarNotificaciones(); } };
$('chip').onclick = async () => { if (Guaguas.getModoDinamico()) { if (usuario()) ajustes(true); else activarDinamico(); } else if ((await activarDinamico()) === true) { ui(); Guaguas.activarNotificaciones(); } };
$('gear').onclick = () => ajustes(true);
$('sok').onclick = () => $('sheet').classList.add('oculto');
$('sheet').onclick = e => { if (e.target === $('sheet')) $('sheet').classList.add('oculto'); };

function ajustes(abrir) {
  if (abrir) $('sheet').classList.remove('oculto');
  const u = usuario(), d = Guaguas.getModoDinamico(), p = Guaguas.perfil(), t = localStorage.getItem('tema') || 'auto';
  const nombre = u ? (u.displayName || u.email || 'Mi cuenta') : 'Mi cuenta';
  const desde = u && u.metadata && u.metadata.creationTime ? new Date(u.metadata.creationTime).toLocaleDateString('es', { month: 'long', year: 'numeric' }) : '';
  const seg = (id, ops, val) => `<div class="seg" data-id="${id}">${ops.map(([v, l]) => `<button data-v="${v}" class="${v === val ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  const notif = !window.Notification ? 'No disponible' : Notification.permission === 'granted' ? 'Activadas' : Notification.permission === 'denied' ? 'Bloqueadas' : 'Activar';
  $('sbody').innerHTML = `
    <div class="acct"><div class="av">${esc(nombre[0].toUpperCase())}</div><div><b>${esc(nombre)}</b>${u && u.email ? `<small>${esc(u.email)}</small>` : ''}${desde ? `<small>Miembro desde ${esc(desde)}</small>` : ''}</div></div>
    ${d && p ? `<h4>Fiabilidad</h4><div class="grp"><div class="rel"><div class="relh"><b>${esc(p.nivel)}</b><span>${p.puntos} puntos</span></div><div class="bar"><i style="width:${Math.max(3, Math.min(100, p.puntos))}%"></i></div><small>${p.confirmadas} de ${p.subidas} avisos confirmados por otras personas</small></div></div>` : ''}
    <h4>Preferencias</h4><div class="grp">
      <div class="li"><span>Datos</span>${seg('modo', [['estatico', 'Horarios'], ['dinamico', 'Tiempo real']], d ? 'dinamico' : 'estatico')}</div>
      <div class="li"><span>Apariencia</span>${seg('tema', [['auto', 'Auto'], ['light', 'Claro'], ['dark', 'Oscuro']], t)}</div>
      <button class="li" id="s-notif"><span>Notificaciones</span><em>${notif}</em></button></div>
    <h4></h4><div class="grp"><button class="li red" id="s-out">Cerrar sesión</button></div>`;
}
$('sbody').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  const id = b.parentElement.dataset && b.parentElement.dataset.id;
  if (id === 'tema') { localStorage.setItem('tema', b.dataset.v); tema(); ajustes(); }
  else if (id === 'modo') { if (b.dataset.v === 'dinamico') { if ((await activarDinamico()) === true) Guaguas.activarNotificaciones(); } else Guaguas.setModoDinamico(false); }
  else if (b.id === 's-notif') { const r = await Guaguas.activarNotificaciones(); toast(r === 'ok' ? 'Notificaciones activadas.' : r === 'denegado' ? 'Las notificaciones están bloqueadas en el navegador.' : 'Este navegador no admite notificaciones.'); ajustes(); }
  else if (b.id === 's-out') {
    try { await window.firebaseSignOut(); } catch (_) {}
    Guaguas.setInternalToken(null); Guaguas.setModoDinamico(false); $('sheet').classList.add('oculto'); ui();
  }
};

async function exchangeFirebaseToken(idToken) {
  try {
    const r = await fetch('/api/firebase-token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id_token: idToken }) });
    const j = await r.json().catch(() => ({}));
    if (j.ok && j.token) { Guaguas.setInternalToken(j.token); return true; }
  } catch (e) { console.warn('firebase-token:', e.message); }
  return false;
}
async function handleRedirectResult() {
  const pendiente = !!sessionStorage.getItem('pendingDinamico');
  let user = null, err = null;
  try { const r = await window.firebaseGetRedirectResult(); user = r && r.user; } catch (e) { err = e; console.warn('redirect:', e.code, e.message); }
  try { await window.firebaseAuthReady(); } catch (_) {}
  user = user || usuario(); sessionStorage.removeItem('pendingDinamico');
  if (user && (pendiente || localStorage.getItem('modoDinamico') === null)) { Guaguas.setModoDinamico(true); ocultarIntro(); ui(); Guaguas.activarNotificaciones(false); return; }
  if (err) { const m = mensajeError(err); if (m) toast(m + ' [' + (err.code || err.message) + ']'); }
  else if (pendiente) toast('Google te devolvió a la app pero la sesión no se guardó. Prueba con ?authdomain=propio al final de la dirección.', 12000);
}

// ── Arranque ──
if (localStorage.getItem('modoDinamico') === null && !sessionStorage.getItem('pendingDinamico')) mostrarIntro();
ui();
Guaguas.onModoChange(() => { ui(); if (actual) cargar(); });
Guaguas.onPerfil(() => { if (!$('sheet').classList.contains('oculto')) ajustes(); });
Guaguas.iniciar().catch(e => console.warn('identidad de dispositivo no disponible:', e.message));
datos().catch(e => toast('Error cargando datos: ' + e.message + '. Abre la página desde el servidor Flask.', 12000));
(async () => {
  authListo = await window.firebaseListo;
  if (!authListo) return console.warn('Firebase no disponible: modo estático.');
  await handleRedirectResult();
  if (localStorage.getItem('modoDinamico') === null) mostrarIntro();
  window.firebaseOnAuthChanged(async u => {
    if (u) { try { await exchangeFirebaseToken(await u.getIdToken()); } catch (e) { console.warn(e.message); } } else Guaguas.setInternalToken(null);
    ui();
  });
})();
if ('serviceWorker' in navigator) {
  window.__swTeniaControl = !!navigator.serviceWorker.controller;
  window.swListo = navigator.serviceWorker.register('/sw.js').then(r => { r.update().catch(() => {}); return r; }).catch(e => { console.warn('SW:', e.message); return null; });
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!window.__swRecargado && window.__swTeniaControl) { window.__swRecargado = true; location.reload(); } });
}
</script>
</body>
</html>
