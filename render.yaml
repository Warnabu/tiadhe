services:
  - type: web
    name: tiadhe-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT servidor:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: tiadhe-db
          property: connectionString
      - key: FIREBASE_CRED_PATH
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TZ
        value: Atlantic/Canary
    region: frankfurt
    plan: free